name: 更新项目状态

on:
  schedule:
    - cron: "17 2 * * 1"   # 每周一 10:17（北京时间）
  workflow_dispatch:
  push:
    branches: [main]
    paths: [data/projects.json]

permissions:
  contents: write

concurrency:
  group: update-status
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 抓取 GitHub 状态
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-status.mjs
      - name: 抓取维基百科封面
        run: node scripts/update-covers.mjs
      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/status.json data/covers.json
          git diff --cached --quiet || git commit -m "chore: 自动更新项目状态"
          git pull --rebase && git push
